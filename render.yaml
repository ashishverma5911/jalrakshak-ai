# JalRakshak AI — Render Infrastructure as Code Blueprint
# Zero-cost (₹0) Public Demonstration Architecture
# Consisting of:
# 1. Render Static Site: React 18 SPA (Free Tier)
# 2. Render Web Service: FastAPI Python 3.9 ASGI Container (Free Tier)

services:
  # JalRakshak AI — Backend ASGI Web Service (Free Tier)
  - type: web
    name: jalrakshak-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://jalrakshak-frontend.onrender.com,http://localhost:5173"
      # Optional Gemma 4 AI Studio Key for neural explanation layer
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/v1/health

  # JalRakshak AI — Frontend React SPA Static Site (Free Tier)
  - type: static
    name: jalrakshak-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    baseDir: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jalrakshak-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
