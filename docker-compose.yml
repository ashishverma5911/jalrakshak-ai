version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalrakshak-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:80
      - DATA_STALENESS_HOURS=24.0
      - GEMMA_API_URL=http://host.docker.internal:11434/api/generate
      - GEMMA_MODEL_NAME=gemma:4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jalrakshak-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
